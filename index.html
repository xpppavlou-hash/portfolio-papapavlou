
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio Χρύσα</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #1a1a1f;
  line-height: 1.6;
  background: linear-gradient(135deg, #f2f2f7, #e0e0ea);
}

.container {
  width: 90%;
  max-width: 900px;
  margin: auto;
}

/* PORTFOLIO */
.portfolio {
  margin-top: 0;
  padding-top: 0;
}

.project {
  margin-bottom: 42px;
}

.project img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 16px;
  border: 1px solid rgba(0,0,0,0.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 80px 20px 100px;
}

.contact p {
  font-size: 24px;
  margin-bottom: 30px;
  color: #444;
}

.button {
  padding: 14px 26px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  transition: all .25s ease;
  background: #ffb085;
  color: #1a1a1f;
  display: inline-block;
  margin: 6px;
  border: 1px solid rgba(0,0,0,0.05);
}

.button:hover {
  transform: translateY(-3px);
  background: #ffa070;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

footer {
  text-align: center;
  padding: 30px;
  font-size: 14px;
  color: #555;
}

@media(max-width:700px) {
  .contact p {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<section class="portfolio container">

  <div class="project"><img src="portfolio-1.png" alt="Portfolio 1" /></div>
  <div class="project"><img src="portfolio-2.png" alt="Portfolio 2" /></div>
  <div class="project"><img src="portfolio-3.png" alt="Portfolio 3" /></div>
  <div class="project"><img src="portfolio-4.png" alt="Portfolio 4" /></div>
  <div class="project"><img src="portfolio-5.png" alt="Portfolio 5" /></div>
  <div class="project"><img src="portfolio-6.png" alt="Portfolio 6" /></div>
  <div class="project"><img src="portfolio-7.png" alt="Portfolio 7" /></div>
  <div class="project"><img src="portfolio-8.png" alt="Portfolio 8" /></div>
  <div class="project"><img src="portfolio-9.png" alt="Portfolio 9" /></div>
  <div class="project"><img src="portfolio-10.png" alt="Portfolio 10" /></div>
  <div class="project"><img src="portfolio-11.png" alt="Portfolio 11" /></div>
  <div class="project"><img src="portfolio-12.png" alt="Portfolio 12" /></div>

</section>

<section class="contact">
  <p>Θα χαρώ να συνεργαστούμε.</p>
  <a class="button" href="https://instagram.com/xrysart" target="_blank" rel="noopener noreferrer">Instagram</a>
</section>

<footer>© 2026 Portfolio</footer>

</body>
</html>
